name: web-auth-playground

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: web_auth_playground
      POSTGRES_USER: web_auth_playground
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15433}:5432'
    volumes:
      # PostgreSQL 18 の公式イメージは、この配下にバージョン別の保存先を作る。
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ は Compose で展開せず、コンテナ内の環境変数を参照するために使う。
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  pgdata:
